services:
  - type: web
    name: pond-crypto-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: POND_ACCESS_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
